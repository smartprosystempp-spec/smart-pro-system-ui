name: Smart Pro Cards recovery checks
on:
  pull_request:
  push:
    branches:
      - recovery/alpha-10-foundation

permissions:
  contents: read

jobs:
  source-integrity-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source integrity and registration smoke test
        run: npm test
