name: Smart Pro Cards recovery checks
on:
  pull_request:
  push:
    branches:
      - recovery/alpha-10-foundation

permissions:
  contents: read

jobs:
  source-integrity-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source integrity and registration smoke test
        run: npm test
      - name: Publish Light Card visual review artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: smart-pro-light-visual-lab
          path: dist/smart-pro-light-visual-lab.html
          if-no-files-found: error
          retention-days: 14
      - name: Attach experimental Light Card runtime candidate
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: smart-pro-light-runtime-candidate
          path: dist/smart-pro-cards-themed.js
          if-no-files-found: error
          retention-days: 14

      - name: Attach separately registered Light QA card
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: smart-pro-light-isolated-qa
          path: dist/smart-pro-light-qa.js
          if-no-files-found: error
          retention-days: 14
